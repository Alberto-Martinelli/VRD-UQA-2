[project]
name = "vrd-uqa"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "accelerate>=1.13.0",
    "datasets<4.0.0",
    "doclayout-yolo>=0.0.4",
    "einops>=0.8.2",
    "gliner>=0.2.25",
    "google-generativeai>=0.8.6",
    "huggingface-hub<=1.5.0",
    "langdetect>=1.0.9",
    "nltk>=3.9.3",
    "ollama>=0.6.1",
    "pandas>=3.0.1",
    "pdf2image>=1.17.0",
    "peft>=0.14.0",
    "qwen-vl-utils>=0.0.14",
    "requests>=2.32.5",
    "scikit-learn>=1.8.0",
    "supervision>=0.27.0.post1",
    "tiktoken>=0.12.0",
    "timm>=1.0.27",
    "torch<2.6",
    "torchvision<0.21",
    "tqdm>=4.67.3",
    "transformers>=4.51.3",
    "verovio>=6.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Install the repo's own packages (editable via `uv sync`) so `config` and
# `datasets_api` import from anywhere — SLURM by-path scripts, -m, notebooks —
# without PYTHONPATH or sys.path hacks. `finetuning`/`VQA_analysis` are run by
# path, not imported as packages, so they are intentionally not listed.
[tool.hatch.build.targets.wheel]
packages = ["config", "datasets_api"]

[[tool.uv.index]]
name = "pytorch-gpu"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-gpu", marker = "sys_platform != 'darwin'" }
]
torchvision = [
    { index = "pytorch-gpu", marker = "sys_platform != 'darwin'" }
]

[tool.uv]
environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'"
]
